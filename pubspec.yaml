name: gitee_client_flutter
description: A Flutter Gitee Client application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dio: ^5.9.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  fluttertoast: ^9.0.0
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  html: ^0.15.7
  connectivity_plus: ^7.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.0
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true
  assets:
    - static/font/
    - static/image/
  fonts:
    - family: iconFontCN
      fonts:
        - asset: static/font/iconfont/iconfont.ttf
